name: Changesets

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run test:release
      - name: Validate pending changesets
        run: npm run changeset -- status
      - name: Require a changeset or a release version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-changeset.mjs
