name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: piper-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.repository == 'teal-fm/piper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:version && npm run test:release
      - name: Create or update release PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          title: 'chore(release): version Piper'
          commit: 'chore(release): version Piper'
          createGithubReleases: false
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const { releaseNotes } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-notes.mjs`);
            const notes = releaseNotes(version, fs.readFileSync('CHANGELOG.md', 'utf8'), process.env.GITHUB_REPOSITORY);
            const tag = `v${version}`;
            // List releases because tag lookup does not reliably return drafts.
            let release;
            for await (const response of github.paginate.iterator(github.rest.repos.listReleases, { ...context.repo, per_page: 100 })) {
              release = response.data.find(item => item.tag_name === tag);
              if (release) break;
            }
            if (release && !release.draft) {
              core.info(`${tag} is already published.`);
              core.setOutput('publish', 'false');
              return;
            }
            if (release && release.target_commitish !== context.sha) {
              throw new Error(`Rerun the original workflow for draft ${tag} at ${release.target_commitish}.`);
            }
            // An existing tag must never be silently repointed to another commit.
            try {
              const { data } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              if (data.object.sha !== context.sha) throw new Error(`${tag} already exists at a different commit.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!release) {
              const { data } = await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.sha,
                name: `Piper ${tag}`, body: notes, draft: true, prerelease: false,
              });
              release = data;
            }
            core.setOutput('id', release.id);
            core.setOutput('publish', 'true');
            core.setOutput('tag', tag);
            core.setOutput('version', version);
            core.setOutput('image', `ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}`);
      - uses: actions/setup-go@v5
        if: steps.release.outputs.publish == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release
        if: steps.release.outputs.publish == 'true'
        run: |
          npm run check:version
          npm run test:release
          npm run build:css
          go test -race ./...
      - uses: docker/setup-qemu-action@v3
        if: steps.release.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.release.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned images
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
            ${{ steps.release.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      # Keep publication here: GITHUB_TOKEN releases do not trigger other workflows.
      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: Number(process.env.RELEASE_ID),
              draft: false, make_latest: 'true',
            });
